name: Project 04 Publish ECR

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish-image:
    runs-on: ubuntu-latest

    env:
      AWS_REGION: us-east-1
      ECR_REPOSITORY: portfolio-p04-task-manager
      IMAGE_TAG: sha-${{ github.sha }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Configure temporary AWS credentials through OIDC
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ vars.AWS_P04_ECR_PUBLISH_ROLE_ARN }}
          role-session-name: Project04EcrPublish

      - name: Log in to private Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@d539f0932e70871a027e9d5a9d8fc38589180a64 # v2.1.6

      - name: Build and push immutable image
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: >-
          docker build --pull
          --tag "$REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          --file projects/04-devops-cicd/docker/Dockerfile
          projects/01-web-task-manager/app
          && docker push "$REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"

      - name: Verify published digest
        run: >-
          aws ecr batch-get-image
          --repository-name "$ECR_REPOSITORY"
          --image-ids imageTag="$IMAGE_TAG"
          --query 'images[0].imageId.[imageTag,imageDigest]'
          --output table
