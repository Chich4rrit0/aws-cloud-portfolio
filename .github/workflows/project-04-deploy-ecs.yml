name: Project 04 Deploy ECS

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: Immutable ECR image tag to deploy (for example sha-<commit>)
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      AWS_REGION: us-east-1
      ECR_REPOSITORY: portfolio-p04-task-manager
      ECS_CLUSTER: portfolio-p04-ecs-lab
      ECS_SERVICE: portfolio-p04-task-manager
      CONTAINER_NAME: task-manager-api

    steps:
      - name: Configure temporary AWS credentials through OIDC
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ vars.AWS_P04_ECS_DEPLOY_ROLE_ARN }}
          role-session-name: Project04EcsDeploy

      - name: Verify the immutable image exists
        run: >-
          aws ecr describe-images
          --repository-name "$ECR_REPOSITORY"
          --image-ids imageTag="${{ inputs.image_tag }}"
          --query 'imageDetails[0].imageDigest'
          --output text

      - name: Register a task definition revision for the selected image
        id: task-definition
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          CURRENT_TASK_DEFINITION=$(aws ecs describe-services --cluster "$ECS_CLUSTER" --services "$ECS_SERVICE" --query 'services[0].taskDefinition' --output text)
          REPOSITORY_URI=$(aws ecr describe-repositories --repository-names "$ECR_REPOSITORY" --query 'repositories[0].repositoryUri' --output text)
          aws ecs describe-task-definition --task-definition "$CURRENT_TASK_DEFINITION" --query taskDefinition --output json > task-definition.json
          jq --arg container "$CONTAINER_NAME" --arg image "$REPOSITORY_URI:$IMAGE_TAG" 'del(.taskDefinitionArn, .revision, .status, .requiresAttributes, .compatibilities, .registeredAt, .registeredBy, .deregisteredAt) | (.containerDefinitions[] | select(.name == $container) | .image) = $image' task-definition.json > task-definition-next.json
          NEW_TASK_DEFINITION=$(aws ecs register-task-definition --cli-input-json file://task-definition-next.json --query 'taskDefinition.taskDefinitionArn' --output text)
          echo "arn=$NEW_TASK_DEFINITION" >> "$GITHUB_OUTPUT"

      - name: Update only the temporary ECS service
        run: >-
          aws ecs update-service
          --cluster "$ECS_CLUSTER"
          --service "$ECS_SERVICE"
          --task-definition "${{ steps.task-definition.outputs.arn }}"
          --force-new-deployment
          --query 'service.taskDefinition'
          --output text

      - name: Wait for service stabilization
        run: |
          for attempt in {1..45}; do
            read -r ROLLOUT_STATE RUNNING_COUNT DESIRED_COUNT < <(
              aws ecs describe-services \
                --cluster "$ECS_CLUSTER" \
                --services "$ECS_SERVICE" \
                --query 'services[0].deployments[?status==`PRIMARY`]|[0].[rolloutState,runningCount,desiredCount]' \
                --output text
            )

            if [[ "$ROLLOUT_STATE" == "COMPLETED" && "$RUNNING_COUNT" == "$DESIRED_COUNT" ]]; then
              echo "ECS deployment is stable after attempt $attempt."
              exit 0
            fi

            if [[ "$ROLLOUT_STATE" == "FAILED" ]]; then
              echo "ECS deployment failed before becoming stable." >&2
              exit 1
            fi

            echo "Attempt $attempt/45: rollout=$ROLLOUT_STATE running=$RUNNING_COUNT desired=$DESIRED_COUNT"
            sleep 20
          done

          echo "ECS deployment did not stabilize within 15 minutes." >&2
          exit 1
