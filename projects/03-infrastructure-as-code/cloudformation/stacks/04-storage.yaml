AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  Project 03 plan-only reconstruction of Project 01 private artifact and frontend S3 buckets.
  This template creates no resources until an explicitly approved CloudFormation deployment is executed.

Parameters:
  ProjectPrefix:
    Type: String
    Default: portfolio-p03
    AllowedPattern: '^[a-z0-9-]+$'

  Environment:
    Type: String
    Default: lab
    AllowedValues:
      - lab

Resources:
  ArtifactBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub '${ProjectPrefix}-artifacts-${AWS::AccountId}-${AWS::Region}'
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      Tags:
        - Key: Name
          Value: !Sub '${ProjectPrefix}-artifacts'
        - Key: Project
          Value: aws-cloud-portfolio
        - Key: ProjectNumber
          Value: '03'
        - Key: Environment
          Value: !Ref Environment
        - Key: ManagedBy
          Value: cloudformation

  FrontendBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub '${ProjectPrefix}-frontend-${AWS::AccountId}-${AWS::Region}'
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      Tags:
        - Key: Name
          Value: !Sub '${ProjectPrefix}-frontend'
        - Key: Project
          Value: aws-cloud-portfolio
        - Key: ProjectNumber
          Value: '03'
        - Key: Environment
          Value: !Ref Environment
        - Key: ManagedBy
          Value: cloudformation

Outputs:
  ArtifactBucketName:
    Description: Private bucket name for immutable application release ZIPs.
    Value: !Ref ArtifactBucket
    Export:
      Name: !Sub '${AWS::StackName}-ArtifactBucketName'

  ArtifactBucketArn:
    Description: Private artifact bucket ARN for runtime IAM policy scope.
    Value: !GetAtt ArtifactBucket.Arn
    Export:
      Name: !Sub '${AWS::StackName}-ArtifactBucketArn'

  FrontendBucketName:
    Description: Private frontend origin bucket name for a later CloudFront stack.
    Value: !Ref FrontendBucket
    Export:
      Name: !Sub '${AWS::StackName}-FrontendBucketName'

  FrontendBucketArn:
    Description: Private frontend origin bucket ARN for a later CloudFront bucket policy.
    Value: !GetAtt FrontendBucket.Arn
    Export:
      Name: !Sub '${AWS::StackName}-FrontendBucketArn'
